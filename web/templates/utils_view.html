<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Name}} - Аналитика</title>
    <link rel="icon" type="image/png" href="/static/assets/overseer.png">
    
    <!-- Локальные стили -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
    
    <!-- ИСПРАВЛЕНО: Подключаем наш новый монолитный Chart.js UMD -->
    <script src="/static/js/chart.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-body-tertiary border-bottom border-translucent">
        <div class="container">
            <a class="btn btn-outline-secondary btn-sm" href="/">◀ Назад к модулям</a>
            <span class="navbar-text ms-auto text-light fw-bold">Модуль: {{.Name}}</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4">
            <div class="col">
                <h1 class="fw-bold">{{.Name}}</h1>
                <p class="text-muted">{{.Description}}</p>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                {{.CustomHTML}} <!-- Сюда Go вклеит табы со склада -->
            </div>
		</div>
    </div>

    <!-- Локальный Bootstrap, ожививший табы -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    
    <!-- Подгружаем скрипт логики со склада -->
    <script src="/static/js/utils/{{.CustomJS}}"></script>
</body>
</html>
