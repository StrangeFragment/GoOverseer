<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoOverseer Панель</title>
    <link rel="icon" type="image/png" href="/static/assets/overseer.png">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <!-- Верхняя навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-body-tertiary border-bottom border-translucent">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="/static/assets/overseer.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
                <strong>GoOverseer</strong>
            </a>
             <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <span class="navbar-text">
                    <b>{{.Name}}.</b>&nbsp;{{.Description}}
                </span>
             </ul>
            <button onclick="shutdownServer()" class="btn btn-outline-danger btn-sm">
                Выгрузить оркестратор
            </button>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-12">
                {{.CustomHTML}} <!-- Сюда Go вклеит табы со склада -->
            </div>
		</div>
    </div>

    <!-- Локальный Bootstrap, ожививший табы -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    
    <!-- Подгружаем скрипт логики со склада -->
    <script src="/static/js/utils/{{.CustomJS}}"></script>
</body>
</html>
