<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoOverseer Панель</title>
    <link rel="icon" type="image/png" href="/static/assets/overseer.png">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <!-- Верхняя навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-body-tertiary border-bottom border-translucent">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="/static/assets/overseer.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top me-2">
                <strong>GoOverseer</strong>
            </a>
            <button onclick="shutdownServer()" class="btn btn-outline-danger btn-sm">
                Выгрузить оркестратор
            </button>
        </div>
    </nav>

    <!-- Основной контейнер управления -->
    <div class="container my-5">
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-bold">Управление модулями системы</h2>
                <p class="text-muted">Ниже представлены обнаруженные демоны-регистраторы.</p>
            </div>
        </div>

        <!-- Сюда JavaScript будет динамически вставлять карточки утилит -->
        <div id="utils-container" class="row row-cols-1 g-4">
            <div class="col text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Загрузка модулей...</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/static/js/bootstrap.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
